<!DOCTYPE html>
<html lang="ru" data-portal-domain="super.scox.space">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark light" />
	<title>super.scox.space</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
	<style>
		:root {
			--bg0: #07080c;
			--bg1: #10141f;
			--glass: rgba(18, 22, 32, 0.72);
			--stroke: rgba(255, 255, 255, 0.09);
			--text: #eef1f6;
			--dim: rgba(238, 241, 246, 0.55);
			--accent: #7eb8ff;
			--accent2: #a78bfa;
			--shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
		}
		@media (prefers-color-scheme: light) {
			:root {
				--bg0: #f0f2f8;
				--bg1: #e2e6f0;
				--glass: rgba(255, 255, 255, 0.78);
				--stroke: rgba(15, 20, 35, 0.1);
				--text: #121520;
				--dim: rgba(18, 21, 32, 0.5);
				--accent: #2563eb;
				--accent2: #6d28d9;
				--shadow: 0 20px 40px rgba(35, 45, 80, 0.12);
			}
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Outfit", system-ui, sans-serif;
			color: var(--text);
			background:
				radial-gradient(ellipse 80% 60% at 20% 0%, rgba(126, 184, 255, 0.18), transparent 55%),
				radial-gradient(ellipse 70% 50% at 90% 20%, rgba(167, 139, 250, 0.14), transparent 50%),
				linear-gradient(165deg, var(--bg0), var(--bg1));
			display: grid;
			place-items: center;
			padding: clamp(20px, 4vw, 40px);
		}
		.panel {
			width: min(680px, 100%);
			padding: clamp(28px, 5vw, 40px);
			border-radius: 24px;
			background: var(--glass);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1px solid var(--stroke);
			box-shadow: var(--shadow);
		}
		.brand {
			margin: 0 0 28px;
			font-size: clamp(1.35rem, 4vw, 1.6rem);
			font-weight: 600;
			letter-spacing: -0.03em;
			line-height: 1.2;
			background: linear-gradient(120deg, var(--text), var(--dim));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}
		@media (prefers-color-scheme: light) {
			.brand {
				background: linear-gradient(120deg, #121520, #455068);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
		}
		.search {
			display: grid;
			gap: 12px;
			margin-bottom: 22px;
		}
		.search-row {
			display: flex;
			gap: 10px;
		}
		.search-input {
			width: 100%;
			min-width: 0;
			padding: 16px 18px;
			border: 1px solid var(--stroke);
			border-radius: 16px;
			color: var(--text);
			background: rgba(255, 255, 255, 0.05);
			font: inherit;
			outline: none;
			transition: border-color 0.2s ease, box-shadow 0.2s ease;
		}
		.search-input::placeholder { color: var(--dim); }
		.search-input:focus {
			border-color: color-mix(in oklab, var(--accent) 55%, var(--stroke));
			box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 16%, transparent);
		}
		.search-submit,
		.source-button {
			border: 1px solid var(--stroke);
			color: var(--text);
			background: rgba(255, 255, 255, 0.06);
			font: inherit;
			cursor: pointer;
			transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
		}
		.search-submit {
			padding: 0 18px;
			border-radius: 16px;
			font-weight: 600;
			white-space: nowrap;
		}
		.source-grid {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 8px;
		}
		.source-button {
			min-height: 44px;
			padding: 10px 8px;
			border-radius: 14px;
			font-weight: 600;
		}
		.search-submit:hover,
		.source-button:hover:not(:disabled) {
			transform: translateY(-1px);
			border-color: color-mix(in oklab, var(--accent) 45%, var(--stroke));
		}
		.source-button[aria-pressed="true"] {
			border-color: color-mix(in oklab, var(--accent) 70%, var(--stroke));
			background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 22%, transparent), color-mix(in oklab, var(--accent2) 16%, transparent));
		}
		.source-button:disabled {
			cursor: not-allowed;
			opacity: 0.45;
		}
		.search-submit:focus-visible,
		.source-button:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 3px;
		}
		.results {
			display: none;
			margin: 2px 0 22px;
			padding: 14px;
			border: 1px solid var(--stroke);
			border-radius: 18px;
			background: rgba(255, 255, 255, 0.03);
		}
		.results.is-visible { display: block; }
		.results-status {
			margin: 0;
			color: var(--dim);
			font-size: 0.95rem;
		}
		.results-list {
			display: grid;
			gap: 10px;
			margin: 12px 0 0;
			padding: 0;
			list-style: none;
		}
		.result-link {
			display: grid;
			gap: 6px;
			padding: 12px;
			border-radius: 14px;
			color: inherit;
			text-decoration: none;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid transparent;
		}
		.result-link:hover,
		.result-link:focus-visible {
			border-color: color-mix(in oklab, var(--accent) 45%, var(--stroke));
			outline: none;
		}
		.result-title {
			font-weight: 600;
			line-height: 1.25;
		}
		.result-meta {
			color: var(--dim);
			font-size: 0.9rem;
		}
		@media (max-width: 560px) {
			.search-row { flex-direction: column; }
			.search-submit { min-height: 48px; }
			.source-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
		}
		.tiles {
			display: grid;
			gap: 12px;
		}
		.tile {
			display: flex;
			align-items: center;
			gap: 16px;
			padding: 18px 20px;
			border-radius: 16px;
			text-decoration: none;
			color: inherit;
			border: 1px solid var(--stroke);
			background: rgba(255, 255, 255, 0.03);
			transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
		}
		@media (prefers-color-scheme: light) {
			.tile { background: rgba(255, 255, 255, 0.5); }
		}
		.tile:hover {
			transform: translateY(-2px);
			border-color: color-mix(in oklab, var(--accent) 45%, var(--stroke));
			box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
		}
		.tile:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 3px;
		}
		.tile-icon {
			width: 44px;
			height: 44px;
			border-radius: 12px;
			display: grid;
			place-items: center;
			font-size: 1.25rem;
			line-height: 1;
			flex-shrink: 0;
			background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 35%, transparent), color-mix(in oklab, var(--accent2) 25%, transparent));
			border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
		}
		.tile-label {
			font-size: 1.05rem;
			font-weight: 600;
			letter-spacing: -0.02em;
		}
		.tile-arrow {
			margin-left: auto;
			opacity: 0.45;
			font-size: 1.1rem;
		}
	</style>
</head>
<body>
	<div class="panel">
		<h1 class="brand" id="brand">super.scox.space</h1>
		<form class="search" id="search-form">
			<div class="search-row">
				<input class="search-input" id="search-input" name="q" type="search" autocomplete="off" minlength="2" placeholder="Найти раздачу" required />
				<button class="search-submit" type="submit">Искать</button>
			</div>
			<div class="source-grid" aria-label="Источники поиска">
				<button class="source-button" type="button" data-source="rutracker" aria-pressed="true">RuTracker</button>
				<button class="source-button" type="button" data-source="prowlarr" aria-pressed="false">Индексатор</button>
				<button class="source-button" type="button" disabled title="Источник будет добавлен позже">Источник 3</button>
				<button class="source-button" type="button" disabled title="Источник будет добавлен позже">Источник 4</button>
			</div>
		</form>
		<section class="results" id="results" aria-live="polite">
			<p class="results-status" id="results-status"></p>
			<ul class="results-list" id="results-list"></ul>
		</section>
		<nav class="tiles" aria-label="Сервисы">
			<a class="tile" id="link-prowlarr" href="/prowlarr/" rel="noopener">
				<span class="tile-icon" aria-hidden="true">⌕</span>
				<span class="tile-label">Поиск</span>
				<span class="tile-arrow" aria-hidden="true">→</span>
			</a>
			<a class="tile" id="link-deluge" href="/flood/" rel="noopener">
				<span class="tile-icon" aria-hidden="true">⇩</span>
				<span class="tile-label">Торренты</span>
				<span class="tile-arrow" aria-hidden="true">→</span>
			</a>
			<a class="tile" id="link-jellyfin" href="/jellyfin/" rel="noopener">
				<span class="tile-icon" aria-hidden="true">▶</span>
				<span class="tile-label">Просмотр</span>
				<span class="tile-arrow" aria-hidden="true">→</span>
			</a>
		</nav>
	</div>
	<script>
		(function () {
			var portal = document.documentElement.getAttribute("data-portal-domain");
			var brand = document.getElementById("brand");
			if (brand && portal && location.hostname !== portal) {
				brand.textContent = location.host || "Медиа";
				document.title = brand.textContent;
			}
			if (portal && location.hostname === portal && portal.indexOf(".") !== -1) {
				var z = portal;
				var m = {
					"link-prowlarr": "https://lft." + z + "/",
					"link-deluge": "https://mmd." + z + "/",
					"link-jellyfin": "https://wwv." + z + "/"
				};
				Object.keys(m).forEach(function (id) {
					var el = document.getElementById(id);
					if (el) el.setAttribute("href", m[id]);
				});
			}

			var selectedSource = "rutracker";
			var form = document.getElementById("search-form");
			var input = document.getElementById("search-input");
			var results = document.getElementById("results");
			var status = document.getElementById("results-status");
			var list = document.getElementById("results-list");
			var buttons = document.querySelectorAll(".source-button[data-source]");

			function setSource(source) {
				selectedSource = source;
				buttons.forEach(function (button) {
					button.setAttribute("aria-pressed", button.dataset.source === source ? "true" : "false");
				});
			}

			function showStatus(message) {
				results.classList.add("is-visible");
				status.textContent = message;
			}

			function clearResults() {
				list.textContent = "";
			}

			function prowlarrSearchUrl(query) {
				var link = document.getElementById("link-prowlarr");
				var base = link ? link.getAttribute("href") : "/prowlarr/";
				var separator = base.indexOf("?") === -1 ? "?" : "&";
				return base.replace(/\/?$/, "/") + "search" + separator + "term=" + encodeURIComponent(query);
			}

			function renderResults(items) {
				clearResults();
				if (!items.length) {
					showStatus("Ничего не найдено.");
					return;
				}

				showStatus("Найдено: " + items.length);
				items.forEach(function (item) {
					var li = document.createElement("li");
					var link = document.createElement("a");
					var title = document.createElement("span");
					var meta = document.createElement("span");
					var details = [item.forum, item.size, item.seeders != null ? "S: " + item.seeders : null, item.leechers != null ? "L: " + item.leechers : null].filter(Boolean);

					link.className = "result-link";
					link.href = item.url || "https://rutracker.org/forum/";
					link.target = "_blank";
					link.rel = "noopener";
					title.className = "result-title";
					title.textContent = item.title || "Без названия";
					meta.className = "result-meta";
					meta.textContent = details.join(" · ");

					link.appendChild(title);
					if (meta.textContent) link.appendChild(meta);
					li.appendChild(link);
					list.appendChild(li);
				});
			}

			buttons.forEach(function (button) {
				button.addEventListener("click", function () {
					setSource(button.dataset.source);
				});
			});

			form.addEventListener("submit", function (event) {
				event.preventDefault();
				var query = input.value.trim();
				if (query.length < 2) return;

				if (selectedSource === "prowlarr") {
					location.href = prowlarrSearchUrl(query);
					return;
				}

				clearResults();
				showStatus("Ищу на RuTracker...");

				fetch("/api/rutracker/search?q=" + encodeURIComponent(query))
					.then(function (response) {
						if (!response.ok) {
							return response.json().catch(function () { return {}; }).then(function (body) {
								throw new Error(body.detail || "Ошибка поиска");
							});
						}
						return response.json();
					})
					.then(function (body) {
						renderResults(body.items || []);
					})
					.catch(function (error) {
						clearResults();
						showStatus(error.message || "Не удалось выполнить поиск.");
					});
			});
		})();
	</script>
</body>
</html>
