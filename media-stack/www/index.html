<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark light" />
	<title>Медиа</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
	<style>
		:root {
			--bg0: #07080c;
			--bg1: #10141f;
			--blob1: #7eb8ff;
			--blob2: #a78bfa;
			--blob3: #22d3ee;
			--blob-opacity: 0.45;
			--mesh-angle: 155deg;
			--glass: rgba(18, 22, 32, 0.42);
			--stroke: rgba(255, 255, 255, 0.16);
			--highlight: rgba(255, 255, 255, 0.24);
			--caustic: rgba(255, 255, 255, 0.06);
			--reflection-start: rgba(255, 255, 255, 0.22);
			--reflection-end: rgba(255, 255, 255, 0);
			--glare: rgba(255, 255, 255, 0.18);
			--text: #eef1f6;
			--dim: rgba(238, 241, 246, 0.55);
			--accent: #7eb8ff;
			--accent2: #a78bfa;
			--button-bg: rgba(255, 255, 255, 0.08);
			--button-hover: rgba(255, 255, 255, 0.18);
			--button-border: rgba(255, 255, 255, 0.16);
			--icon-bg: rgba(255, 255, 255, 0.12);
			--shadow: 0 42px 90px rgba(0, 0, 0, 0.45), 0 12px 30px rgba(0, 0, 0, 0.28);
			--font: "Outfit", system-ui, sans-serif;
			--panel-radius: 34px;
			--tile-radius: 24px;
			--icon-radius: 18px;
			--panel-border-width: 1px;
			--hover-lift: -3px;
			--blob-1-top: -16%;
			--blob-1-left: -12%;
			--blob-2-bottom: -18%;
			--blob-2-right: -10%;
			--blob-3-top: 28%;
			--blob-3-left: 45%;
		}
		@media (prefers-color-scheme: light) {
			:root {
				--bg0: #f0f2f8;
				--bg1: #e2e6f0;
				--blob1: #ff2a5f;
				--blob2: #007aff;
				--blob3: #ff9500;
				--blob-opacity: 0.56;
				--glass: rgba(255, 255, 255, 0.18);
				--stroke: rgba(255, 255, 255, 0.42);
				--highlight: rgba(255, 255, 255, 0.72);
				--caustic: rgba(255, 255, 255, 0.32);
				--reflection-start: rgba(255, 255, 255, 0.62);
				--reflection-end: rgba(255, 255, 255, 0);
				--glare: rgba(255, 255, 255, 0.48);
				--text: #121520;
				--dim: rgba(18, 21, 32, 0.5);
				--accent: #2563eb;
				--accent2: #6d28d9;
				--button-bg: rgba(255, 255, 255, 0.36);
				--button-hover: rgba(255, 255, 255, 0.62);
				--button-border: rgba(255, 255, 255, 0.46);
				--icon-bg: rgba(255, 255, 255, 0.48);
				--shadow: 0 42px 90px rgba(45, 55, 90, 0.18), 0 12px 30px rgba(45, 55, 90, 0.12);
			}
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			font-family: var(--font);
			color: var(--text);
			background: linear-gradient(var(--mesh-angle), var(--bg0), var(--bg1));
			display: grid;
			place-items: center;
			padding: clamp(20px, 4vw, 40px);
			overflow: hidden;
			-webkit-font-smoothing: antialiased;
		}
		.bg-mesh {
			position: fixed;
			inset: 0;
			z-index: -1;
			overflow: hidden;
			background: linear-gradient(var(--mesh-angle), var(--bg0), var(--bg1));
			transition: background 0.8s ease;
		}
		.blob {
			position: absolute;
			border-radius: 999px;
			filter: blur(90px);
			opacity: var(--blob-opacity);
			will-change: transform;
			animation: float 22s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
		}
		.blob-1 {
			width: min(560px, 62vw);
			height: min(560px, 62vw);
			top: var(--blob-1-top);
			left: var(--blob-1-left);
			background: var(--blob1);
		}
		.blob-2 {
			width: min(520px, 58vw);
			height: min(520px, 58vw);
			right: var(--blob-2-right);
			bottom: var(--blob-2-bottom);
			background: var(--blob2);
			animation-delay: -7s;
		}
		.blob-3 {
			width: min(420px, 48vw);
			height: min(420px, 48vw);
			top: var(--blob-3-top);
			left: var(--blob-3-left);
			background: var(--blob3);
			animation-delay: -13s;
		}
		@keyframes float {
			0% { transform: translate(0, 0) scale(1) rotate(0deg); }
			33% { transform: translate(5%, 9%) scale(1.06) rotate(5deg); }
			66% { transform: translate(-6%, 4%) scale(0.96) rotate(-6deg); }
			100% { transform: translate(2%, -10%) scale(1.12) rotate(2deg); }
		}
		.tiles {
			position: relative;
			z-index: 1;
			display: grid;
			gap: 0;
			width: min(330px, 100%);
			padding: 12px 0;
			border-radius: var(--panel-radius);
			background: var(--glass);
			backdrop-filter: blur(50px) saturate(200%);
			-webkit-backdrop-filter: blur(50px) saturate(200%);
			box-shadow:
				var(--shadow),
				inset 0 2px 3px -1px var(--highlight),
				inset 0 -2px 4px -1px var(--caustic),
				inset 0 0 0 var(--panel-border-width) var(--stroke);
			overflow: hidden;
		}
		.tiles::before {
			content: "";
			position: absolute;
			top: 1px;
			left: 1px;
			right: 1px;
			height: 42%;
			border-radius: var(--panel-radius) var(--panel-radius) 28px 28px / var(--panel-radius) var(--panel-radius) 14px 14px;
			background: linear-gradient(180deg, var(--reflection-start), var(--reflection-end));
			pointer-events: none;
			z-index: 3;
		}
		.tiles::after {
			content: "";
			position: absolute;
			inset: 0;
			background: radial-gradient(circle 170px at var(--glare-x, 50%) var(--glare-y, 18%), var(--glare), transparent 70%);
			mix-blend-mode: overlay;
			opacity: 0;
			transition: opacity 0.25s ease;
			pointer-events: none;
			z-index: 2;
		}
		.tiles:hover::after {
			opacity: 1;
		}
		.tile {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 54px;
			padding: 0 34px;
			border-radius: 0;
			text-decoration: none;
			color: inherit;
			border: 0;
			background: transparent;
			box-shadow: none;
			overflow: hidden;
			-webkit-tap-highlight-color: transparent;
			transition: color 0.22s ease, text-shadow 0.22s ease;
		}
		.tile::before {
			content: none;
		}
		.tile + .tile::after {
			content: "";
			position: absolute;
			top: 0;
			left: 46px;
			right: 46px;
			height: 1px;
			background: linear-gradient(90deg, transparent, var(--button-border) 12%, var(--button-border) 88%, transparent);
			opacity: 0.82;
			pointer-events: none;
		}
		.tile:hover {
			color: color-mix(in oklab, var(--accent) 34%, var(--text));
			text-shadow: 0 0 18px color-mix(in oklab, var(--accent) 42%, transparent);
		}
		.tile:active {
			color: color-mix(in oklab, var(--accent2) 38%, var(--text));
		}
		.tile:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 3px;
		}
		.tile-icon {
			display: none;
		}
		html[data-frame="none"] .tiles {
			--panel-border-width: 0px;
		}
		html[data-buttons="solid"] .tile {
			background: transparent;
		}
		html[data-buttons="outline"] .tile {
			background: transparent;
		}
		html[data-buttons="soft"] .tile {
			background: transparent;
			box-shadow: none;
		}
		html[data-buttons="compact"] .tile {
			min-height: 48px;
			padding: 0 28px;
		}
		.tile-label {
			position: relative;
			z-index: 1;
			font-size: 1.08rem;
			font-weight: 600;
			letter-spacing: -0.02em;
			text-align: center;
		}
		.tile-arrow {
			display: none;
		}
		html[dir="rtl"] .tile {
			direction: rtl;
		}
		html[dir="rtl"] .tile + .tile::after {
			left: 46px;
			right: 46px;
		}
		@media (max-width: 440px) {
			.tiles {
				width: min(100%, 360px);
			}
			.tile-label {
				font-size: 1rem;
			}
		}
	</style>
</head>
<body>
