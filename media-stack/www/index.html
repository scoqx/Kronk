<!DOCTYPE html>
<html lang="ru" data-portal-domain="super.scox.space">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark light" />
	<title>super.scox.space</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
	<style>
		:root {
			--bg0: #07080c;
			--bg1: #10141f;
			--glass: rgba(18, 22, 32, 0.72);
			--stroke: rgba(255, 255, 255, 0.09);
			--text: #eef1f6;
			--dim: rgba(238, 241, 246, 0.55);
			--accent: #7eb8ff;
			--accent2: #a78bfa;
			--glow1: rgba(126, 184, 255, 0.18);
			--glow2: rgba(167, 139, 250, 0.14);
			--shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
			--font: "Outfit", system-ui, sans-serif;
			--panel-radius: 24px;
			--tile-radius: 16px;
			--icon-radius: 12px;
			--panel-border-width: 1px;
			--tile-bg: rgba(255, 255, 255, 0.03);
			--hover-lift: -2px;
		}
		@media (prefers-color-scheme: light) {
			:root {
				--bg0: #f0f2f8;
				--bg1: #e2e6f0;
				--glass: rgba(255, 255, 255, 0.78);
				--stroke: rgba(15, 20, 35, 0.1);
				--text: #121520;
				--dim: rgba(18, 21, 32, 0.5);
				--accent: #2563eb;
				--accent2: #6d28d9;
				--glow1: rgba(37, 99, 235, 0.14);
				--glow2: rgba(109, 40, 217, 0.12);
				--shadow: 0 20px 40px rgba(35, 45, 80, 0.12);
				--tile-bg: rgba(255, 255, 255, 0.5);
			}
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			font-family: var(--font);
			color: var(--text);
			background:
				radial-gradient(ellipse 80% 60% at 20% 0%, var(--glow1), transparent 55%),
				radial-gradient(ellipse 70% 50% at 90% 20%, var(--glow2), transparent 50%),
				linear-gradient(165deg, var(--bg0), var(--bg1));
			display: grid;
			place-items: center;
			padding: clamp(20px, 4vw, 40px);
		}
		.panel {
			width: min(680px, 100%);
			padding: clamp(28px, 5vw, 40px);
			border-radius: var(--panel-radius);
			background: var(--glass);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: var(--panel-border-width) solid var(--stroke);
			box-shadow: var(--shadow);
		}
		.brand {
			margin: 0 0 28px;
			font-size: clamp(1.35rem, 4vw, 1.6rem);
			font-weight: 600;
			letter-spacing: -0.03em;
			line-height: 1.2;
			background: linear-gradient(120deg, var(--text), var(--dim));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}
		.tiles {
			display: grid;
			gap: 12px;
		}
		.tile {
			display: flex;
			align-items: center;
			gap: 16px;
			padding: 18px 20px;
			border-radius: var(--tile-radius);
			text-decoration: none;
			color: inherit;
			border: 1px solid var(--stroke);
			background: var(--tile-bg);
			transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
		}
		.tile:hover {
			transform: translateY(var(--hover-lift));
			border-color: color-mix(in oklab, var(--accent) 45%, var(--stroke));
			box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
		}
		.tile:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 3px;
		}
		.tile-icon {
			width: 44px;
			height: 44px;
			border-radius: var(--icon-radius);
			display: grid;
			place-items: center;
			font-size: 1.25rem;
			line-height: 1;
			flex-shrink: 0;
			background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 35%, transparent), color-mix(in oklab, var(--accent2) 25%, transparent));
			border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
		}
		html[data-frame="none"] .panel {
			border-color: transparent;
		}
		html[data-buttons="solid"] .tile {
			background: linear-gradient(135deg, color-mix(in oklab, var(--accent) 26%, transparent), color-mix(in oklab, var(--accent2) 22%, transparent));
		}
		html[data-buttons="outline"] .tile {
			background: transparent;
			border-color: color-mix(in oklab, var(--accent) 34%, var(--stroke));
		}
		html[data-buttons="soft"] .tile {
			background: color-mix(in oklab, var(--accent) 10%, var(--tile-bg));
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
		}
		html[data-buttons="compact"] .tile {
			padding: 14px 16px;
		}
		.tile-label {
			font-size: 1.05rem;
			font-weight: 600;
			letter-spacing: -0.02em;
		}
		.tile-arrow {
			margin-left: auto;
			opacity: 0.45;
			font-size: 1.1rem;
		}
		html[dir="rtl"] .tile {
			direction: rtl;
		}
		html[dir="rtl"] .tile-arrow {
			margin-left: 0;
			margin-right: auto;
			transform: scaleX(-1);
		}
		html[dir="rtl"] .brand {
			direction: ltr;
		}
	</style>
</head>
