# Один внешний вход (gateway): локально — главная и сервисы по префиксам /jellyfin /prowlarr /deluge (caddy/snippets/site.caddy).
# На сервере: CADDY_PRIMARY_FILE=Caddyfile.server + docker-compose.server.yml — отдельный FQDN на портал и на каждый сервис (см. caddy/snippets/site-subdomains.caddy).
#
# Загрузки: ./data/media → Deluge /downloads и Jellyfin /media (библиотека в /media/complete).
#
# После первого запуска:
# - Локально: Jellyfin Base URL /jellyfin; Prowlarr URL Base /prowlarr. Deluge Web — по /deluge/
# - Прод с поддоменами: Base URL / URL Base у Jellyfin/Prowlarr пустые; веб Deluge на поддомене (см. .env.server.example).
# - Prowlarr → Deluge (внутри Docker): хост deluge, порт 58846 (daemon), пароль как в Deluge (Settings → Daemon).
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/media
    networks: [stack]

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - DELUGE_LOGLEVEL=${DELUGE_LOGLEVEL:-info}
    volumes:
      - ./config/deluge:/config
      - ./data/media:/downloads
    ports:
      - "${DELUGE_PEER_PORT:-6881}:6881/tcp"
      - "${DELUGE_PEER_PORT:-6881}:6881/udp"
    networks: [stack]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Исходящие запросы к индексерам: часть сайтов даёт HTTP/2 PROTOCOL_ERROR в .NET — принудительно HTTP/1.x.
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT=false
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./config/prowlarr:/config
    networks: [stack]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./${CADDY_PRIMARY_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./caddy/snippets:/etc/caddy/snippets:ro
      - ./www:/srv:ro
    depends_on:
      - jellyfin
      - deluge
      - prowlarr
    networks: [stack]

networks:
  stack:
    driver: bridge
