# Один внешний вход (gateway): локально — главная и сервисы по префиксам /jellyfin /prowlarr /transmission (caddy/snippets/site.caddy).
# На сервере: CADDY_PRIMARY_FILE=Caddyfile.server + docker-compose.server.yml — отдельный FQDN на портал и на каждый сервис (см. caddy/snippets/site-subdomains.caddy).
#
# Загрузки: ./data/media → Transmission /downloads (complete/incomplete), Jellyfin /media (библиотека /media/complete).
#
# После первого запуска:
# - Локально: Jellyfin Base URL /jellyfin; Prowlarr URL Base /prowlarr.
# - Прод с поддоменами: Base URL / URL Base пустые; TRANSMISSION_HOST_WHITELIST — все FQDN (портал + поддомены), см. .env.server.example.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/media
    networks: [stack]

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - USER=${TRANSMISSION_USER:-admin}
      - PASS=${TRANSMISSION_PASS:-changeme}
      - TRANSMISSION_WEB_HOME=/transmissionic-web
      # Прод с поддоменами: задайте список через запятую (портал + каждый сервис). Если пусто — только PUBLIC_HOSTNAME.
      - HOST_WHITELIST=${TRANSMISSION_HOST_WHITELIST:-${PUBLIC_HOSTNAME:-}}
      - WHITELIST=${TRANSMISSION_RPC_WHITELIST:-}
      - PEERPORT=${TRANSMISSION_PEER_PORT:-51413}
    volumes:
      - ./config/transmission:/config
      - ./data/media:/downloads
      - ./config/transmissionic-web:/transmissionic-web:ro
    ports:
      - "${TRANSMISSION_PEER_PORT:-51413}:51413/tcp"
      - "${TRANSMISSION_PEER_PORT:-51413}:51413/udp"
    networks: [stack]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Исходящие запросы к индексерам: часть сайтов даёт HTTP/2 PROTOCOL_ERROR в .NET — принудительно HTTP/1.x.
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT=false
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./config/prowlarr:/config
    networks: [stack]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./${CADDY_PRIMARY_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./caddy/snippets:/etc/caddy/snippets:ro
      - ./www:/srv:ro
    depends_on:
      - jellyfin
      - transmission
      - prowlarr
    networks: [stack]

networks:
  stack:
    driver: bridge
