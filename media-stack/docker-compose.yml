# Один внешний вход (gateway): локально — главная и сервисы по префиксам /metube /jellyfin /prowlarr (caddy/snippets/site.caddy).
# На сервере: CADDY_PRIMARY_FILE=Caddyfile.server + docker-compose.server.yml — отдельный FQDN на портал и на каждый сервис (см. caddy/snippets/site-subdomains.caddy).
#
# Загрузки: ./data/downloads → qBittorrent /downloads; библиотека: ./data/media → Jellyfin/Radarr/Sonarr /media.
#
# После первого запуска:
# - Локально: Jellyfin Base URL /jellyfin; Prowlarr URL Base /prowlarr. Prismarr UI — порт 7070.
# - Прод с поддоменами: Base URL / URL Base у Jellyfin/Prowlarr пустые; Prismarr UI на поддомене (см. .env.server.example).
# - Prismarr → qBittorrent: URL http://qbittorrent:8080, username admin, временный пароль в логах qbittorrent.
# - Prismarr → Prowlarr: URL http://prowlarr:9696, API key из Prowlarr.
# - Prismarr → Radarr: URL http://radarr:7878, API key из Radarr.
# - Prismarr → Sonarr: URL http://sonarr:8989, API key из Sonarr.
# - Prowlarr → qBittorrent: хост qbittorrent, порт 8080, username admin, пароль qBittorrent Web UI.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/media
    networks: [stack]

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${TORRENT_PEER_PORT:-6881}
    volumes:
      - ./config/qbittorrent:/config
      - ./data/downloads:/downloads
      - ./data/media:/media
    ports:
      - "${TORRENT_PEER_PORT:-6881}:${TORRENT_PEER_PORT:-6881}/tcp"
      - "${TORRENT_PEER_PORT:-6881}:${TORRENT_PEER_PORT:-6881}/udp"
    networks: [stack]

  metube:
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      DOWNLOAD_DIR: /downloads
      AUTH_USERNAME: ${METUBE_AUTH_USERNAME:-}
      AUTH_PASSWORD: ${METUBE_AUTH_PASSWORD:-}
    volumes:
      - ./data/media:/downloads
    networks: [stack]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Исходящие запросы к индексерам: часть сайтов даёт HTTP/2 PROTOCOL_ERROR в .NET — принудительно HTTP/1.x.
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT=false
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./config/prowlarr:/config
    networks: [stack]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - ./config/radarr:/config
      - ./data/downloads:/downloads
      - ./data/media:/media
    networks: [stack]

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - ./config/sonarr:/config
      - ./data/downloads:/downloads
      - ./data/media:/media
    networks: [stack]

  prismarr:
    image: shoshuo/prismarr:latest
    container_name: prismarr
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-UTC}
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - "${PRISMARR_HTTP_PORT:-7070}:7070"
    volumes:
      - prismarr_data:/var/www/html/var/data
    depends_on:
      - qbittorrent
      - prowlarr
      - radarr
      - sonarr
    networks: [stack]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./${CADDY_PRIMARY_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./caddy/snippets:/etc/caddy/snippets:ro
      - ./www:/srv:ro
      - ./caddy/letsencrypt:/etc/letsencrypt:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - jellyfin
      - qbittorrent
      - metube
      - prowlarr
      - radarr
      - sonarr
      - prismarr
    networks: [stack]

networks:
  stack:
    driver: bridge

volumes:
  prismarr_data:
