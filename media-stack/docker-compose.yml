# Один внешний вход (gateway): локально — главная и сервисы по префиксам /jellyfin /prowlarr /flood (caddy/snippets/site.caddy).
# На сервере: CADDY_PRIMARY_FILE=Caddyfile.server + docker-compose.server.yml — отдельный FQDN на портал и на каждый сервис (см. caddy/snippets/site-subdomains.caddy).
#
# Загрузки: ./data/media → qBittorrent /downloads и Jellyfin /media (библиотека в /media/complete).
#
# После первого запуска:
# - Локально: Jellyfin Base URL /jellyfin; Prowlarr URL Base /prowlarr. Flood UI — по /flood/
# - Прод с поддоменами: Base URL / URL Base у Jellyfin/Prowlarr пустые; Flood UI на поддомене (см. .env.server.example).
# - Flood → qBittorrent: URL http://qbittorrent:8080, username admin, временный пароль в логах qbittorrent.
# - Prowlarr → qBittorrent: хост qbittorrent, порт 8080, username admin, пароль qBittorrent Web UI.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/media
    networks: [stack]

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${TORRENT_PEER_PORT:-6881}
    volumes:
      - ./config/qbittorrent:/config
      - ./data/media:/downloads
      - ./data/media:/media
    ports:
      - "${TORRENT_PEER_PORT:-6881}:${TORRENT_PEER_PORT:-6881}/tcp"
      - "${TORRENT_PEER_PORT:-6881}:${TORRENT_PEER_PORT:-6881}/udp"
    networks: [stack]

  flood:
    image: jesec/flood:latest
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "3000", "--rundir", "/config/flood", "--allowedpath", "/downloads"]
    volumes:
      - ./config/flood:/config/flood
      - ./data/media:/downloads
    depends_on:
      - qbittorrent
    networks: [stack]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Исходящие запросы к индексерам: часть сайтов даёт HTTP/2 PROTOCOL_ERROR в .NET — принудительно HTTP/1.x.
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT=false
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./config/prowlarr:/config
    networks: [stack]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./${CADDY_PRIMARY_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./caddy/snippets:/etc/caddy/snippets:ro
      - ./www:/srv:ro
    depends_on:
      - jellyfin
      - qbittorrent
      - flood
      - prowlarr
    networks: [stack]

networks:
  stack:
    driver: bridge
