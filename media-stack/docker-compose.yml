# Один внешний вход (gateway): локально — главная и сервисы по префиксам /jellyfin /prowlarr /aria2 (caddy/snippets/site.caddy).
# На сервере: CADDY_PRIMARY_FILE=Caddyfile.server + docker-compose.server.yml — отдельный FQDN на портал и на каждый сервис (см. caddy/snippets/site-subdomains.caddy).
#
# Загрузки: ./data/media → Aria2 /downloads и Jellyfin /media (библиотека в /media/complete).
#
# После первого запуска:
# - Локально: Jellyfin Base URL /jellyfin; Prowlarr URL Base /prowlarr. AriaNg UI — по /aria2/
# - Прод с поддоменами: Base URL / URL Base у Jellyfin/Prowlarr пустые; AriaNg UI на поддомене (см. .env.server.example).
# - Prowlarr → Aria2 (внутри Docker): хост aria2, порт 6800, secret из ARIA2_RPC_SECRET.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/media
    networks: [stack]

  aria2:
    image: p3terx/aria2-pro:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - UMASK_SET=${UMASK_SET:-022}
      - RPC_SECRET=${ARIA2_RPC_SECRET:?Set ARIA2_RPC_SECRET in .env}
      - RPC_PORT=6800
      - LISTEN_PORT=${ARIA2_PEER_PORT:-6881}
    volumes:
      - ./config/aria2:/config
      - ./data/media:/downloads
    ports:
      - "${ARIA2_PEER_PORT:-6881}:${ARIA2_PEER_PORT:-6881}/tcp"
      - "${ARIA2_PEER_PORT:-6881}:${ARIA2_PEER_PORT:-6881}/udp"
    networks: [stack]

  aria2-ui:
    image: p3terx/ariang:latest
    restart: unless-stopped
    depends_on:
      - aria2
    networks: [stack]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Исходящие запросы к индексерам: часть сайтов даёт HTTP/2 PROTOCOL_ERROR в .NET — принудительно HTTP/1.x.
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT=false
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./config/prowlarr:/config
    networks: [stack]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./${CADDY_PRIMARY_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./caddy/snippets:/etc/caddy/snippets:ro
      - ./www:/srv:ro
    depends_on:
      - jellyfin
      - aria2
      - aria2-ui
      - prowlarr
    networks: [stack]

networks:
  stack:
    driver: bridge
