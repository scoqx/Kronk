# Дополнение для сервера: HTTPS :443, несколько имён для Let's Encrypt (Caddy).
# Запуск: ./scripts/server-deploy.sh   или   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# В .env: PUBLIC_HOSTNAME, METUBE_HOSTNAME, PROWLARR_HOSTNAME, PRISMARR_HOSTNAME, JELLYFIN_HOSTNAME,
# CADDY_PRIMARY_FILE=Caddyfile.server, EDGE_HTTP_PORT=80.
services:
  gateway:
    ports:
      - "${EDGE_HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in .env}
      METUBE_HOSTNAME: ${METUBE_HOSTNAME:?Set METUBE_HOSTNAME in .env}
      METUBE_AUTH_USERNAME: ${METUBE_AUTH_USERNAME:?Set METUBE_AUTH_USERNAME in .env}
      METUBE_AUTH_PASSWORD_HASH: ${METUBE_AUTH_PASSWORD_HASH:?Set METUBE_AUTH_PASSWORD_HASH in .env}
      PROWLARR_HOSTNAME: ${PROWLARR_HOSTNAME:?Set PROWLARR_HOSTNAME in .env}
      PRISMARR_HOSTNAME: ${PRISMARR_HOSTNAME:?Set PRISMARR_HOSTNAME in .env}
      JELLYFIN_HOSTNAME: ${JELLYFIN_HOSTNAME:?Set JELLYFIN_HOSTNAME in .env}
