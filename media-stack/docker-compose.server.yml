# Дополнение для сервера: HTTPS :443 + env PUBLIC_HOSTNAME для Let's Encrypt (Caddy).
# Запуск: ./scripts/server-deploy.sh   или   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# В .env: PUBLIC_HOSTNAME, CADDY_PRIMARY_FILE=Caddyfile.server, EDGE_HTTP_PORT=80; пароль Transmission и т.д.
# HOST_WHITELIST Transmission: если TRANSMISSION_HOST_WHITELIST пуст, подставляется PUBLIC_HOSTNAME (см. docker-compose.yml).
services:
  gateway:
    ports:
      - "${EDGE_HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in .env}
